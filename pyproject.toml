[project]
name = "data-science-jobs"
version = "0.1.0"
description = "A live job board for data science, analytics, ML, and data engineering roles with direct company application links."
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.2",
  "requests>=2.31",
  "streamlit>=1.36",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

